@if(agent()) {
<div class="title">
  <h3>{{ agent()?.nickname }}</h3>
  <div class="icons">
      <i [title]="agent()?.lastKnownStatus"  class="fas fa-{{iconConverter.transform(agent()!.lastKnownStatus)}}"></i>
    </div>
</div>

<div class="info">
  <app-map [coordinates]="agent()?.currentLocation"></app-map>
</div>
} @else {
<div class="info">Aucun agent sélectionné</div>
}
