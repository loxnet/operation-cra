@if(agentStore.agents()) {
<ul>
  @for(agent of agentStore.agents(); track trackByIndex($index)) {
    <li (click)="selectAgent(agent)" class="gradient-border shine-effect">
      <span>{{agent.nickname}}</span>
      <div class="info">
        @if(showWarning(agent)) {
          <i class="fas fa-handshake"></i>
        }
        <i [title]="agent.lastKnownStatus"  class="fas fa-{{iconConverter.transform(agent.lastKnownStatus)}}"></i>
      </div>
    </li>
  }
</ul>
}
