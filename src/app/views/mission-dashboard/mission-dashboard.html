<div class="dashboard-container">
  <div class="dashboard-filters">
    <h3>
      <i class="fas fa-filter"></i>
      Filtrer les missions
    </h3>
    <div class="filter-buttons">
      <button
        class="filter-btn"
        [class.active]="currentFilter() === null"
        (click)="setFilter(null)"
      >
        Toutes
      </button>
      <button
        class="filter-btn"
        [class.active]="currentFilter() === MissionStatus.IN_PROGRESS"
        (click)="setFilter(MissionStatus.IN_PROGRESS)"
      >
        En cours
      </button>
      <button
        class="filter-btn"
        [class.active]="currentFilter() === MissionStatus.PLANNED"
        (click)="setFilter(MissionStatus.PLANNED)"
      >
        Planifiées
      </button>
      <button
        class="filter-btn"
        [class.active]="currentFilter() === MissionStatus.OVER"
        (click)="setFilter(MissionStatus.OVER)"
      >
        Terminées
      </button>
    </div>
    <div class="reset-section">
      <button
        class="reset-btn"
        (click)="resetAllData()"
        [disabled]="missionStore.isLoading() || agentStore.isLoading()"
      >
        <i class="fas fa-rotate-right"></i>
        Réinitialiser les données
      </button>
    </div>
  </div>

  <div class="dashboard-timeline">
    <app-mission-timeline
      [missions]="missionStore.missions()"
      [agents]="agentStore.agents()"
      [filter]="currentFilter()"
      (assignmentRequest)="onAssignmentRequest($event)"
    />
  </div>

  <div class="dashboard-agents">
    <app-operational-agent-list
      [agents]="agentStore.agents()"
      [missions]="missionStore.missions()"
    />
  </div>
</div>

@if (replacementDialogData(); as dialogData) {
  <app-agent-replacement-dialog
    [data]="dialogData"
    (confirm)="onConfirmReplacement()"
    (cancel)="onCancelReplacement()"
  />
}
